<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 172 172" width="172" height="172" role="img" aria-label="Casts">
  <defs>
    <linearGradient id="harbour" x1="0%" y1="0%" x2="35%" y2="100%">
      <stop offset="0%" stop-color="#176275"/>
      <stop offset="100%" stop-color="#0A3340"/>
    </linearGradient>
    <linearGradient id="tower" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E6EEF1"/>
      <stop offset="45%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C9D6DB"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect width="172" height="172" rx="36" fill="url(#harbour)"/>

  <!-- Broadcast arcs -->
  <path d="M112 56 A36 36 0 0 1 138 98"
        fill="none" stroke="#8ED6E2" stroke-width="6" stroke-linecap="round"/>
  <path d="M122 42 A54 54 0 0 1 152 98"
        fill="none" stroke="#8ED6E2" stroke-width="5.5" stroke-linecap="round" opacity="0.72"/>
  <path d="M132 28 A72 72 0 0 1 164 98"
        fill="none" stroke="#8ED6E2" stroke-width="5" stroke-linecap="round" opacity="0.42"/>

  <!-- Pier -->
  <rect x="52" y="118" width="48" height="12" rx="2.5" fill="#A8BBC3"/>

  <!-- Tower -->
  <path d="M64 118 L70 66 L102 66 L108 118 Z" fill="url(#tower)"/>
  <path d="M66.8 100 L105.2 100 L106.4 110 L65.6 110 Z" fill="#0A3340"/>
  <path d="M68.6 80 L103.4 80 L104.4 90 L67.6 90 Z" fill="#0A3340"/>

  <!-- Water (over pier base so lighthouse sits in harbour) -->
  <path d="M0 126 C28 118, 48 134, 86 126 C124 118, 144 134, 172 126 L172 172 L0 172 Z"
        fill="#061F27" opacity="0.78"/>
  <path d="M12 128 C40 120, 58 136, 86 128 C114 120, 132 136, 160 128"
        fill="none" stroke="#4E9AAB" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- Lantern room -->
  <rect x="66" y="50" width="40" height="20" rx="3.5" fill="#F4F8FA"/>
  <rect x="72" y="54" width="8" height="12" rx="1.5" fill="#145868"/>
  <rect x="92" y="54" width="8" height="12" rx="1.5" fill="#145868"/>
  <rect x="62" y="46" width="48" height="7" rx="2.5" fill="#D0DCE1"/>

  <!-- Beacon -->
  <circle cx="86" cy="36" r="12" fill="#F0B429"/>
  <circle cx="86" cy="36" r="5" fill="#FFF6D0"/>
</svg>
